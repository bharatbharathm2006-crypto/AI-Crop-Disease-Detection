<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgroVision AI - Farmer Profile</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
            color: #1f2937;
        }

        .profile-container {
            max-width: 850px;
            margin: 50px auto;
            padding: 20px;
        }

        .profile-card {
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            margin: auto;
            border-radius: 50%;
            background: #dcfce7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 55px;
        }

        .profile-header h1 {
            margin-top: 18px;
            margin-bottom: 8px;
            color: #166534;
            font-size: 32px;
        }

        .profile-header p {
            color: #6b7280;
            margin: 0;
        }

        .profile-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .profile-item {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 20px;
        }

        .profile-item .label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .profile-item .value {
            color: #111827;
            font-size: 17px;
            font-weight: 600;
            word-break: break-word;
        }

        .profile-item.full-width {
            grid-column: 1 / -1;
        }

        .profile-actions {
            text-align: center;
            margin-top: 30px;
        }

        .dashboard-button {
            display: inline-block;
            padding: 13px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin: 5px;
        }

        .dashboard-button:hover {
            background: #1d4ed8;
            color: white;
        }

        .logout-button {
            display: inline-block;
            padding: 13px 25px;
            background: #dc2626;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            margin: 5px;
        }

        .logout-button:hover {
            background: #b91c1c;
            color: white;
        }

        .profile-note {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 650px) {

            .profile-container {
                margin: 20px auto;
                padding: 12px;
            }

            .profile-card {
                padding: 25px 18px;
            }

            .profile-details {
                grid-template-columns: 1fr;
            }

            .profile-item.full-width {
                grid-column: auto;
            }

            .profile-header h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="profile-container">


    <div class="profile-card">


        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div class="profile-icon">
                👨‍🌾
            </div>

            <h1>
                Farmer Profile
            </h1>

            <p>
                Your AgroVision AI account information
            </p>

        </div>


        <!-- PROFILE DETAILS -->

        <div class="profile-details">


            <!-- NAME -->

            <div class="profile-item">

                <div class="label">
                    👤 Full Name
                </div>

                <div class="value">
                    {{ farmer[0] }}
                </div>

            </div>


            <!-- EMAIL -->

            <div class="profile-item">

                <div class="label">
                    📧 Email Address
                </div>

                <div class="value">
                    {{ farmer[1] }}
                </div>

            </div>


            <!-- PHONE -->

            <div class="profile-item">

                <div class="label">
                    📱 Phone Number
                </div>

                <div class="value">
                    {{ farmer[2] }}
                </div>

            </div>


            <!-- ACCOUNT ID -->

            <div class="profile-item">

                <div class="label">
                    🆔 Farmer ID
                </div>

                <div class="value">
                    #{{ farmer[0] }}
                </div>

            </div>


        </div>


        <!-- ACTIONS -->

        <div class="profile-actions">

            <a href="/dashboard"
               class="dashboard-button">

                ⬅ Back to Dashboard

            </a>

            <a href="/logout"
               class="logout-button">

                🚪 Logout

            </a>

        </div>


        <div class="profile-note">

            🌱 AgroVision AI — AI-Powered Crop Disease Detection

        </div>


    </div>


</div>


</body>

</html>
