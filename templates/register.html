<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AgroVision AI - Farmer Registration</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ecfdf5, #f0fdf4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .register-card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
        }

        .register-logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 5px;
        }

        .register-title {
            text-align: center;
            color: #166534;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .register-subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
        }

        .register-button {
            width: 100%;
            border: none;
            padding: 14px;
            margin-top: 8px;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .register-button:hover {
            background: #15803d;
        }

        .login-text {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        .login-text a {
            color: #166534;
            font-weight: 700;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .back-home:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            .register-card {
                padding: 25px 20px;
            }

            .register-title {
                font-size: 26px;
            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <div class="register-card">


        <!-- LOGO -->

        <div class="register-logo">
            🌱
        </div>


        <!-- TITLE -->

        <h1 class="register-title">
            Farmer Registration
        </h1>


        <p class="register-subtitle">
            Create your AgroVision AI farmer account
        </p>


        <!-- REGISTRATION FORM -->

        <form method="POST">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="full_name">
                    👤 Full Name
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    📧 Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-group">

                <label for="phone">
                    📱 Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    🔐 Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="register-button">

                🌱 Create Farmer Account

            </button>


        </form>


        <!-- LOGIN -->

        <div class="login-text">

            Already have an account?

            <a href="/login">
                Login here
            </a>

        </div>


        <!-- HOME -->

        <a href="/" class="back-home">
            ⬅ Back to Home
        </a>


    </div>


</div>


</body>

</html>
